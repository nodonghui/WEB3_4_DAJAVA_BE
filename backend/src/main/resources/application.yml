server:
  port: 8080

spring:
  jackson:
    deserialization:
      fail-on-null-for-primitives: true
  elasticsearch:
    uris: http://localhost:9200
  profiles:
    default: dev
    include: secret
  application:
    name: dajava_server
  datasource:
    url: jdbc:h2:file:./backend/db/db_dev
    username: sa
    password:
    driver-class-name: org.h2.Driver
  cache:
    type: redis
  servlet:
    multipart:
      max-file-size: ${spring.servlet.multipart.max-request-size}
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: create
      dialect: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_batch_fetch_size: 100
        format_sql: true
        highlight_sql: true
        use_sql_comments: true

  data:
    redis:
      host: localhost
      port: 6379
      password: 1234

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: mouseLogEvent
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 200
      fetch-max-wait: 500
      properties:
        spring:
          json:
            trusted:
              packages: 'com.dajava.backend.domain.event.dto'  # 패키지만 지정하면 하위 모든 클래스 허용

    listener:
      type: batch
      concurrency: 3
      ack-mode: batch

image:
  path: backend/images/page-capture




